<h2>Student Login</h2>

{% if error %}
<p style="color:red,">{{error}}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Email</label>
    <input type="email" name="email">

    <label>Password</label>
    <input type="password" name "password">

    <button typre="submit">Login</button>
</form>
 
<a href="{% url 'signup' %}">Create an account</a>
